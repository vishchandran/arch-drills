<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1532" viewBox="0 0 440 1532" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Create and redirect flows</title>
<desc id="desc">Creation: durable database commit, encode, warm cache, return. Redirect: decode, cache hit or bounded replica lookup, HTTP redirect.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#42647b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#162b3b">
<text x="20" y="34" font-size="23" font-weight="700">Create and redirect flows</text>
<rect x="20" y="64" width="400" height="112" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="36" y="93" font-size="21" font-weight="700">1  Create request</text>
<text x="36" y="122" font-size="20">Long URL + operation key</text>
<text x="36" y="149" font-size="20">Validate; resolve prior retries</text>
<path d="M220 176 V204" fill="none" stroke="#42647b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="214" width="400" height="112" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="36" y="243" font-size="21" font-weight="700">2  Authoritative transaction</text>
<text x="36" y="272" font-size="20">DB generates numeric ID</text>
<text x="36" y="299" font-size="20">Mapping + operation result commit</text>
<path d="M220 326 V354" fill="none" stroke="#42647b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="364" width="400" height="112" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="36" y="393" font-size="21" font-weight="700">3  Durable acknowledgement</text>
<text x="36" y="422" font-size="20">Primary + eligible replica policy</text>
<text x="36" y="449" font-size="20">Only then encode and warm cache</text>
<path d="M220 476 V504" fill="none" stroke="#42647b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="514" width="400" height="112" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="36" y="543" font-size="21" font-weight="700">4  Return short URL</text>
<text x="36" y="572" font-size="20">Cache key: numeric ID → long URL</text>
<text x="36" y="599" font-size="20">Cache warm may fail; DB is truth</text>
<text x="20" y="670" font-size="19">A later click starts the redirect path:</text>
<rect x="20" y="690" width="400" height="112" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="36" y="719" font-size="21" font-weight="700">5  Decode short code</text>
<text x="36" y="748" font-size="20">Validate code; Base62 → numeric ID</text>
<text x="36" y="775" font-size="20">Service checks distributed cache</text>
<path d="M220 802 V830" fill="none" stroke="#42647b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="840" width="400" height="112" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="36" y="869" font-size="21" font-weight="700">6  HIT: destination is known</text>
<text x="36" y="898" font-size="20">Skip database read</text>
<text x="36" y="925" font-size="20">Proceed to HTTP redirect</text>
<rect x="20" y="978" width="400" height="112" rx="12" fill="#fff6e7" stroke="#b88731"/>
<text x="36" y="1007" font-size="21" font-weight="700">6  MISS: service reads replica</text>
<text x="36" y="1036" font-size="20">Found: populate cache</text>
<text x="36" y="1063" font-size="20">Lag / failure: bounded policy</text>
<text x="20" y="1136" font-size="19">Hit and successful miss converge below.</text>
<path d="M220 1152 V1180" fill="none" stroke="#42647b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="1190" width="400" height="112" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="36" y="1219" font-size="21" font-weight="700">7  Return HTTP redirect</text>
<text x="36" y="1248" font-size="20">Location contains the long URL</text>
<text x="36" y="1275" font-size="20">Browser requests the destination</text>
<rect x="20" y="1336" width="400" height="112" rx="12" fill="#fff6e7" stroke="#b88731"/>
<text x="36" y="1365" font-size="21" font-weight="700">Fresh-link caveat</text>
<text x="36" y="1394" font-size="20">Warming reduces lag-related misses</text>
<text x="36" y="1421" font-size="20">It cannot guarantee immediate reads</text>
<text x="20" y="1498" font-size="19">No unlimited primary fallback on misses.</text>
</g></svg>