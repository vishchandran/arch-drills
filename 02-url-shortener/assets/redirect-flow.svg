<svg xmlns="http://www.w3.org/2000/svg" width="440" height="910" viewBox="0 0 440 910" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">URL redirect path</title>
<desc id="desc">Decode a valid short code, check distributed cache, read a healthy replica on a miss, apply a bounded freshness policy when necessary, and return an HTTP redirect for the browser to follow.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#42647b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#162b3b">
<text x="20" y="34" font-size="22" font-weight="700">URL redirect path</text>
<rect x="20" y="64" width="400" height="104" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="34" y="92" font-size="20" font-weight="700">Receive and decode</text>
<text x="34" y="120" font-size="19">Validate the public short code</text>
<text x="34" y="148" font-size="19">Base62 → numeric identifier</text>
<path d="M220 168 V194" fill="none" stroke="#42647b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="204" width="400" height="104" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="34" y="232" font-size="20" font-weight="700">Distributed cache lookup</text>
<text x="34" y="260" font-size="19">HIT → destination is known</text>
<text x="34" y="288" font-size="19">MISS → URL Service reads replica</text>
<path d="M220 308 V334" fill="none" stroke="#42647b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="344" width="400" height="104" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="34" y="372" font-size="20" font-weight="700">Indexed replica lookup</text>
<text x="34" y="400" font-size="19">Found → fill cache + use result</text>
<text x="34" y="428" font-size="19">Missing may indicate replica lag</text>
<path d="M220 448 V474" fill="none" stroke="#42647b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="484" width="400" height="104" rx="12" fill="#fff6df" stroke="#c79d42"/>
<text x="34" y="512" font-size="20" font-weight="700">Bounded freshness policy</text>
<text x="34" y="540" font-size="19">Suspected fresh link → limited primary read</text>
<text x="34" y="568" font-size="19">Budget exhausted → temporary failure</text>
<path d="M220 588 V614" fill="none" stroke="#42647b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="624" width="400" height="104" rx="12" fill="#edf8ef" stroke="#7aaa82"/>
<text x="34" y="652" font-size="20" font-weight="700">Return HTTP redirect</text>
<text x="34" y="680" font-size="19">Location contains the long URL</text>
<text x="34" y="708" font-size="19">Browser requests the destination</text>
<rect x="20" y="764" width="400" height="104" rx="12" fill="#fdeeee" stroke="#c78585"/>
<text x="34" y="792" font-size="20" font-weight="700">Dependency safety boundary</text>
<text x="34" y="820" font-size="19">No unlimited primary fallback</text>
<text x="34" y="848" font-size="19">Throttle excess before DB overload</text>
</g></svg>
