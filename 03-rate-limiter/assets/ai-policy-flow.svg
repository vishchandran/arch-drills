<text x="34" y="400" font-size="19" font-weight="400">Contract, history, seasonality</text>
<text x="34" y="428" font-size="19" font-weight="400">Quota floors + bounded changes</text>
<path d="M220 448 V474" fill="none" stroke="#42647b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="484" width="400" height="104" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
