<rect x="20" y="204" width="400" height="104" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="34" y="232" font-size="20" font-weight="700">AI recommendation</text>
<text x="34" y="260" font-size="19" font-weight="400">Bots, IP rotation, tenant anomalies</text>
<text x="34" y="288" font-size="19" font-weight="400">No direct production quota changes</text>
