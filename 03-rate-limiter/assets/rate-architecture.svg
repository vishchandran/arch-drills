<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1050" viewBox="0 0 440 1050" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Rate limiter architecture</title>
<desc id="desc">REQUEST PATH; Client → edge / load balancer; Gateway authenticates the request. Local gateway decision; Cached policy + valid local quota; Allow → service; exhausted → 429. Banking service → downstream; Concurrency and safety limits; Backpressure / load shedding. ASYNC REPLENISHMENT; Gateway reaches low-water mark; Request a quota chunk early. Regional allocator / Redis; Reserve shared capacity atomically; Return a time-bounded grant. Gateway installs valid grant; Continue consuming locally; Failure → endpoint fallback. POLICY DISTRIBUTION; Control plane → gateway cache; Versioned rules + regional budgets</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#42647b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#162b3b">
<text x="20" y="34" font-size="22" font-weight="700">Rate limiter architecture</text>
<rect x="20" y="64" width="400" height="104" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="34" y="92" font-size="20" font-weight="700">REQUEST PATH</text>
<text x="34" y="120" font-size="19" font-weight="400">Client → edge / load balancer</text>
<text x="34" y="148" font-size="19" font-weight="400">Gateway authenticates the request</text>
<path d="M220 168 V194" fill="none" stroke="#42647b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="204" width="400" height="104" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="34" y="232" font-size="20" font-weight="700">Local gateway decision</text>
<text x="34" y="260" font-size="19" font-weight="400">Cached policy + valid local quota</text>
<text x="34" y="288" font-size="19" font-weight="400">Allow → service; exhausted → 429</text>
<path d="M220 308 V334" fill="none" stroke="#42647b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="344" width="400" height="104" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="34" y="372" font-size="20" font-weight="700">Banking service → downstream</text>
<text x="34" y="400" font-size="19" font-weight="400">Concurrency and safety limits</text>
<text x="34" y="428" font-size="19" font-weight="400">Backpressure / load shedding</text>
<rect x="20" y="484" width="400" height="104" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="34" y="512" font-size="20" font-weight="700">ASYNC REPLENISHMENT</text>
<text x="34" y="540" font-size="19" font-weight="400">Gateway reaches low-water mark</text>
<text x="34" y="568" font-size="19" font-weight="400">Request a quota chunk early</text>
<path d="M220 588 V614" fill="none" stroke="#42647b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="624" width="400" height="104" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="34" y="652" font-size="20" font-weight="700">Regional allocator / Redis</text>
<text x="34" y="680" font-size="19" font-weight="400">Reserve shared capacity atomically</text>
<text x="34" y="708" font-size="19" font-weight="400">Return a time-bounded grant</text>
<path d="M220 728 V754" fill="none" stroke="#42647b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="764" width="400" height="104" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="34" y="792" font-size="20" font-weight="700">Gateway installs valid grant</text>
<text x="34" y="820" font-size="19" font-weight="400">Continue consuming locally</text>
<text x="34" y="848" font-size="19" font-weight="400">Failure → endpoint fallback</text>
<rect x="20" y="904" width="400" height="104" rx="12" fill="#eff6fb" stroke="#6b97b3"/>
<text x="34" y="932" font-size="20" font-weight="700">POLICY DISTRIBUTION</text>
<text x="34" y="960" font-size="19" font-weight="400">Control plane → gateway cache</text>
<text x="34" y="988" font-size="19" font-weight="400">Versioned rules + regional budgets</text>
</g></svg>
