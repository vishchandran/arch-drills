<svg xmlns="http://www.w3.org/2000/svg" width="380" height="546" viewBox="0 0 380 546" role="img" aria-labelledby="title desc">
<title id="title">Configuration distribution</title>
<desc id="desc">Global control plane; Define policy and desired configuration → Validated, versioned configuration → Regional distribution; Propagate approved configuration → Regional data planes; Canada, US and Europe → Serve and enforce locally; Use last-known-good configuration</desc>
