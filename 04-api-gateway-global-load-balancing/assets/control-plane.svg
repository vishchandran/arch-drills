<rect width="380" height="546" rx="12" fill="#ffffff"/>
<text x="190" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18364b">Configuration distribution</text>
<rect x="20" y="52" width="340" height="70" rx="9" fill="#edf5fb" stroke="#8aaac2"/>
<text x="190" y="81" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#18364b">Global control plane</text>
<text x="190" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#18364b">Define policy and desired configuration</text>
<path d="M190 122 V139" stroke="#49647a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="146" width="340" height="70" rx="9" fill="#edf5fb" stroke="#8aaac2"/>
<text x="190" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#18364b">Validated, versioned configuration</text>
<path d="M190 216 V233" stroke="#49647a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="240" width="340" height="70" rx="9" fill="#edf5fb" stroke="#8aaac2"/>
<text x="190" y="269" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#18364b">Regional distribution</text>
<text x="190" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#18364b">Propagate approved configuration</text>
<path d="M190 310 V327" stroke="#49647a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="334" width="340" height="70" rx="9" fill="#edf5fb" stroke="#8aaac2"/>
<text x="190" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#18364b">Regional data planes</text>
<text x="190" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#18364b">Canada, US and Europe</text>
