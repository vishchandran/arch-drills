<rect x="20" y="428" width="340" height="70" rx="9" fill="#edf5fb" stroke="#8aaac2"/>
<text x="190" y="457" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#18364b">Serve and enforce locally</text>
<text x="190" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#18364b">Use last-known-good configuration</text>
</svg>
