<rect x="20" y="146" width="340" height="70" rx="9" fill="#edf5fb" stroke="#8aaac2"/>
<text x="190" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#18364b">DNS resolves the entry endpoint</text>
<text x="190" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#18364b">Resolution precedes the API connection</text>
