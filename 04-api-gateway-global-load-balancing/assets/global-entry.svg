<text x="190" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18364b">Global region selection</text>
<rect x="20" y="52" width="340" height="70" rx="9" fill="#edf5fb" stroke="#8aaac2"/>
<text x="190" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#18364b">Client</text>
