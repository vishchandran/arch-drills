<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660" role="img" aria-labelledby="title desc"><title id="title">Governed asynchronous AI analysis</title><desc id="desc">Telemetry feeds asynchronous AI analysis. Predictions pass through deterministic validation, risk-based review, and canary rollout before production adoption.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#49647a"/></marker></defs><rect width="420" height="660" rx="12" fill="#fff"/><g font-family="Arial,sans-serif" fill="#18364b" text-anchor="middle"><text x="210" y="30" font-size="18" font-weight="700">AI governance</text><rect x="45" y="55" width="330" height="72" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text x="210" y="84" font-size="16" font-weight="700">Operational telemetry</text><text x="210" y="108" font-size="13">Metrics • logs • traces • mesh signals</text><path d="M210 127v27" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="161" width="330" height="72" rx="9" fill="#f2edfb" stroke="#9982bd"/><text x="210" y="190" font-size="16" font-weight="700">Asynchronous AI analysis</text><text x="210" y="214" font-size="13">Anomaly • correlation • prediction</text><path d="M210 233v27" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="267" width="330" height="72" rx="9" fill="#fff5df" stroke="#c8a85a"/><text x="210" y="296" font-size="16" font-weight="700">Recommendation or risk signal</text><text x="210" y="320" font-size="13">Confidence and expected blast radius</text><path d="M210 339v27" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="373" width="330" height="72" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text x="210" y="402" font-size="16" font-weight="700">Deterministic validation</text><text x="210" y="426" font-size="13">Policy bounds • health • capacity • residency</text><path d="M210 445v27" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="479" width="330" height="72" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text x="210" y="508" font-size="16" font-weight="700">Risk-based approval</text><text x="210" y="532" font-size="13">Human review for material change</text><path d="M210 551v27" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="585" width="330" height="52" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text x="210" y="617" font-size="16">Canary • observe • roll back</text></g></svg>
