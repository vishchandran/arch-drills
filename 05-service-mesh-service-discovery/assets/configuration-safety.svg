<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660" role="img" aria-labelledby="title desc"><title id="title">Safe configuration delivery</title><desc id="desc">A versioned policy passes validation and a canary. Healthy changes roll out progressively; unhealthy changes restore the last-known-good version.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#49647a"/></marker></defs><rect width="420" height="660" rx="12" fill="#fff"/><g font-family="Arial,sans-serif" fill="#18364b" text-anchor="middle"><text x="210" y="30" font-size="18" font-weight="700">Safe configuration delivery</text><rect x="45" y="55" width="330" height="64" rx="9" fill="#f2edfb" stroke="#9982bd"/><text x="210" y="94" font-size="16">Create immutable version</text><path d="M210 119v25" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="151" width="330" height="78" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text x="210" y="181" font-size="16" font-weight="700">Validate</text><text x="210" y="205" font-size="13">Schema • static • semantic • critical paths</text><path d="M210 229v25" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="261" width="330" height="64" rx="9" fill="#fff5df" stroke="#c8a85a"/><text x="210" y="300" font-size="16">Canary by cohort and region</text><path d="M210 325v25" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><polygon points="210,357 360,417 210,477 60,417" fill="#fff5df" stroke="#c8a85a"/><text x="210" y="412" font-size="16" font-weight="700">Healthy?</text><text x="210" y="436" font-size="13">SLOs • denials • business outcomes</text><path d="M60 417H25v105h78" fill="none" stroke="#a05a5a" stroke-width="2" marker-end="url(#a)"/><path d="M360 417h35v105h-78" fill="none" stroke="#4f8c72" stroke-width="2" marker-end="url(#a)"/><text x="28" y="404" font-size="12">No</text><text x="388" y="404" font-size="12">Yes</text><rect x="35" y="529" width="145" height="72" rx="9" fill="#faeeee" stroke="#c58b8b"/><text x="107" y="558" font-size="15" font-weight="700">Restore LKG</text><text x="107" y="580" font-size="12">Stop expansion</text><rect x="240" y="529" width="145" height="72" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text x="312" y="558" font-size="15" font-weight="700">Progress</text><text x="312" y="580" font-size="12">1% → 5% → 25% → 100%</text></g></svg>
