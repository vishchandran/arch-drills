<svg xmlns="http://www.w3.org/2000/svg" width="420" height="700" viewBox="0 0 420 700" role="img" aria-labelledby="title desc"><title id="title">Service instance lifecycle</title><desc id="desc">An instance starts, registers, passes readiness, serves traffic, becomes not ready, drains requests, deregisters, and terminates.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#49647a"/></marker></defs><rect width="420" height="700" rx="12" fill="#fff"/><text x="210" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#18364b">Service instance lifecycle</text><g font-family="Arial,sans-serif" fill="#18364b" text-anchor="middle" font-size="15"><rect x="50" y="54" width="320" height="56" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text x="210" y="88">Start instance</text><path d="M210 110v23" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="140" width="320" height="56" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text x="210" y="174">Register endpoint and metadata</text><path d="M210 196v23" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="226" width="320" height="70" rx="9" fill="#fff5df" stroke="#c8a85a"/><text x="210" y="255">Liveness passes</text><text x="210" y="278" font-size="13">Known but not yet eligible</text><path d="M210 296v23" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="326" width="320" height="70" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text x="210" y="355">Readiness passes</text><text x="210" y="378" font-size="13">Discoverable and eligible</text><path d="M210 396v23" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="426" width="320" height="56" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text x="210" y="460">Serve traffic</text><path d="M210 482v23" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="512" width="320" height="70" rx="9" fill="#fff5df" stroke="#c8a85a"/><text x="210" y="541">Readiness false</text><text x="210" y="564" font-size="13">Stop new work and drain in-flight requests</text><path d="M210 582v23" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="612" width="145" height="56" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text x="122" y="646">Deregister</text><rect x="225" y="612" width="145" height="56" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text x="297" y="646">Terminate</text><path d="M195 640h23" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/></g></svg>
