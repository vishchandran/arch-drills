<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560" role="img" aria-labelledby="title desc"><title id="title">Locality-aware routing and failover</title><desc id="desc">Payment in Canada AZ1 prefers Fraud in the same AZ, uses Canada AZ2 when local capacity is degraded, and reaches US Fraud only through explicit regional failover.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#49647a"/></marker></defs><rect width="420" height="560" rx="12" fill="#fff"/><g font-family="Arial,sans-serif" fill="#18364b" text-anchor="middle"><text x="210" y="30" font-size="18" font-weight="700">Locality-aware routing</text><rect x="45" y="55" width="330" height="64" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text x="210" y="94" font-size="16">Payment • Canada AZ1</text><path d="M210 119v29" stroke="#4f8c72" stroke-width="3" marker-end="url(#a)"/><rect x="45" y="155" width="330" height="78" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text x="210" y="185" font-size="16" font-weight="700">Fraud • Canada AZ1</text><text x="210" y="209" font-size="13">Preferred while healthy and performant</text><path d="M210 233v29" stroke="#c8a85a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="45" y="269" width="330" height="78" rx="9" fill="#fff5df" stroke="#c8a85a"/><text x="210" y="299" font-size="16" font-weight="700">Fraud • Canada AZ2</text><text x="210" y="323" font-size="13">Use for local degradation or AZ failure</text><path d="M210 347v29" stroke="#a05a5a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="45" y="383" width="330" height="78" rx="9" fill="#faeeee" stroke="#c58b8b"/><text x="210" y="413" font-size="16" font-weight="700">Fraud • United States</text><text x="210" y="437" font-size="13">Explicit regional failover only</text><text x="210" y="505" font-size="13">Eligibility order</text><text x="210" y="529" font-size="14" font-weight="700">Compliance → capacity → health → latency</text></g></svg>
