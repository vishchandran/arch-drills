<svg xmlns="http://www.w3.org/2000/svg" width="420" height="540" viewBox="0 0 420 540" role="img" aria-labelledby="title desc"><title id="title">Regional control and data planes</title><desc id="desc">The mesh control plane distributes versioned policy to autonomous Canada and US data planes. Each region serves local services using locally available state.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#49647a"/></marker></defs><rect width="420" height="540" rx="12" fill="#fff"/><g font-family="Arial,sans-serif" fill="#18364b" text-anchor="middle"><text x="210" y="30" font-size="18" font-weight="700">Regional autonomy</text><rect x="40" y="55" width="340" height="82" rx="9" fill="#f2edfb" stroke="#9982bd"/><text x="210" y="88" font-size="16" font-weight="700">Mesh control plane</text><text x="210" y="113" font-size="13">Validated, versioned desired policy</text><path d="M210 137v35" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="180" width="360" height="92" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text x="210" y="214" font-size="16" font-weight="700">Regional data plane</text><text x="210" y="240" font-size="13">Local enforcement • LKG during management outage</text><path d="M125 272v43" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><path d="M295 272v43" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="322" width="175" height="145" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text x="112" y="356" font-size="16" font-weight="700">Canada</text><text x="112" y="385" font-size="13">Payment</text><text x="112" y="408" font-size="13">Fraud</text><text x="112" y="431" font-size="13">Ledger</text><rect x="220" y="322" width="175" height="145" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text x="307" y="356" font-size="16" font-weight="700">United States</text><text x="307" y="385" font-size="13">Payment</text><text x="307" y="408" font-size="13">Fraud</text><text x="307" y="431" font-size="13">Ledger</text><text x="210" y="510" font-size="13">No cross-region control-plane call in the request path</text></g></svg>
