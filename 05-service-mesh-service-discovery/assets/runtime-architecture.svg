<svg xmlns="http://www.w3.org/2000/svg" width="420" height="620" viewBox="0 0 420 620" role="img" aria-labelledby="title desc">
<title id="title">Service-to-service runtime architecture</title><desc id="desc">Payment calls Fraud through local data-plane proxies. Registry supplies discovery state and the mesh control plane distributes policy outside the request path.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#49647a"/></marker></defs><rect width="420" height="620" rx="12" fill="#fff"/><text x="210" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#18364b">Service-to-service runtime</text>
<g font-family="Arial,sans-serif" fill="#18364b" text-anchor="middle"><rect x="40" y="55" width="340" height="62" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text x="210" y="92" font-size="16">Payment service</text><path d="M210 117v28" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="152" width="340" height="76" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text x="210" y="181" font-size="16" font-weight="700">Payment data-plane proxy</text><text x="210" y="205" font-size="13">Discovery • LB • mTLS • resilience • telemetry</text><path d="M210 228v28" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="263" width="340" height="62" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text x="210" y="300" font-size="16">Fraud data-plane proxy</text><path d="M210 325v28" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="360" width="340" height="62" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text x="210" y="397" font-size="16">Fraud service</text><rect x="25" y="470" width="175" height="94" rx="9" fill="#fff5df" stroke="#c8a85a"/><text x="112" y="501" font-size="15" font-weight="700">Registry</text><text x="112" y="526" font-size="13">Endpoints and</text><text x="112" y="546" font-size="13">readiness state</text><rect x="220" y="470" width="175" height="94" rx="9" fill="#f2edfb" stroke="#9982bd"/><text x="307" y="501" font-size="15" font-weight="700">Control plane</text><text x="307" y="526" font-size="13">Versioned policy</text><text x="307" y="546" font-size="13">and configuration</text></g><path d="M112 470V446H155V228" fill="none" stroke="#c8a85a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M307 470V446H265V228" fill="none" stroke="#9982bd" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
</svg>
