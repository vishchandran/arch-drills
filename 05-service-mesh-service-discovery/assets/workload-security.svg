<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" role="img" aria-labelledby="title desc"><title id="title">Workload identity and authorization</title><desc id="desc">Payment presents its workload identity over mutual TLS. Fraud authenticates the identity, evaluates authorization, and forwards or denies the operation.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#49647a"/></marker></defs><rect width="420" height="600" rx="12" fill="#fff"/><g font-family="Arial,sans-serif" fill="#18364b" text-anchor="middle"><text x="210" y="30" font-size="18" font-weight="700">Workload security</text><rect x="45" y="55" width="330" height="70" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text x="210" y="84" font-size="16" font-weight="700">Payment workload identity</text><text x="210" y="107" font-size="13">Unique, attestable caller identity</text><path d="M210 125v27" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="159" width="330" height="70" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text x="210" y="188" font-size="16" font-weight="700">Mutual TLS</text><text x="210" y="211" font-size="13">Encryption and mutual authentication</text><path d="M210 229v27" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="263" width="330" height="70" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text x="210" y="292" font-size="16" font-weight="700">Authenticate caller</text><text x="210" y="315" font-size="13">Fraud verifies Payment identity</text><path d="M210 333v27" stroke="#49647a" stroke-width="2" marker-end="url(#a)"/><polygon points="210,367 360,427 210,487 60,427" fill="#fff5df" stroke="#c8a85a"/><text x="210" y="421" font-size="16" font-weight="700">Authorized for operation?</text><text x="210" y="445" font-size="13">Least-privilege policy</text><path d="M60 427H25v90h78" fill="none" stroke="#a05a5a" stroke-width="2" marker-end="url(#a)"/><path d="M360 427h35v90h-78" fill="none" stroke="#4f8c72" stroke-width="2" marker-end="url(#a)"/><text x="28" y="414" font-size="12">No</text><text x="388" y="414" font-size="12">Yes</text><rect x="35" y="524" width="145" height="52" rx="9" fill="#faeeee" stroke="#c58b8b"/><text x="107" y="556" font-size="15">Deny</text><rect x="240" y="524" width="145" height="52" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text x="312" y="556" font-size="15">Forward</text></g></svg>
