<svg xmlns="http://www.w3.org/2000/svg" width="420" height="710" viewBox="0 0 420 710" role="img" aria-labelledby="title desc">
  <title id="title">Committed product change propagation</title>
  <desc id="desc">A product write commits to the authoritative database. Change data capture publishes a durable event. A cache consumer validates it, checks its version, and updates the Redis primary with a TTL. Redis asynchronously copies the shard to a replica.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#49647a"/></marker><style>.t{font-family:Arial,sans-serif;fill:#18364b;text-anchor:middle}.b{stroke-width:1.5}.l{fill:none;stroke:#49647a;stroke-width:2;marker-end:url(#arrow)}.d{stroke-dasharray:6 5}</style></defs>
  <rect width="420" height="710" rx="12" fill="#fff"/><text class="t" x="210" y="31" font-size="18" font-weight="700">Committed change propagation</text>
  <g class="t">
    <rect class="b" x="48" y="54" width="324" height="56" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text x="210" y="88" font-size="16">Product write</text><path class="l" d="M210 110v25"/>
    <rect class="b" x="48" y="142" width="324" height="65" rx="9" fill="#f2edfb" stroke="#9982bd"/><text x="210" y="171" font-size="16" font-weight="700">Authoritative DB commit</text><text x="210" y="193" font-size="12">source of truth</text><path class="l" d="M210 207v25"/>
    <rect class="b" x="48" y="239" width="324" height="56" rx="9" fill="#fff5df" stroke="#c8a85a"/><text x="210" y="273" font-size="16">Change data capture</text><path class="l" d="M210 295v25"/>
    <rect class="b" x="48" y="327" width="324" height="56" rx="9" fill="#fff5df" stroke="#c8a85a"/><text x="210" y="361" font-size="16">Durable event transport</text><path class="l" d="M210 383v25"/>
    <rect class="b" x="48" y="415" width="324" height="68" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text x="210" y="444" font-size="16" font-weight="700">Cache consumer</text><text x="210" y="467" font-size="12">validate schema and business values</text><path class="l" d="M210 483v25"/>
    <rect class="b" x="48" y="515" width="324" height="68" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text x="210" y="544" font-size="16" font-weight="700">Atomic version check + update</text><text x="210" y="567" font-size="12">idempotent write with TTL</text><path class="l" d="M210 583v25"/>
    <rect class="b" x="25" y="615" width="170" height="58" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text x="110" y="649" font-size="15">Redis primary</text>
    <rect class="b" x="225" y="615" width="170" height="58" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text x="310" y="649" font-size="15">Shard replica</text>
    <path class="l d" d="M195 644h30"/><text x="210" y="631" font-size="11">async copy</text>
  </g>
</svg>
