<svg xmlns="http://www.w3.org/2000/svg" width="420" height="390" viewBox="0 0 420 390" role="img" aria-labelledby="title desc">
  <title id="title">Critical available-balance boundary</title>
  <desc id="desc">An available-balance request goes through Balance Service directly to the authoritative consistent store and returns a balance response. Redis is outside this critical path.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#49647a"/></marker><style>.t{font-family:Arial,sans-serif;fill:#18364b;text-anchor:middle}.b{stroke-width:1.5}.l{fill:none;stroke:#49647a;stroke-width:2;marker-end:url(#arrow)}</style></defs>
  <rect width="420" height="390" rx="12" fill="#fff"/><text class="t" x="210" y="31" font-size="18" font-weight="700">Critical available-balance path</text>
  <g class="t"><rect class="b" x="45" y="58" width="330" height="58" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text x="210" y="92" font-size="16">Available balance request</text><path class="l" d="M210 116v31"/>
  <rect class="b" x="45" y="154" width="330" height="58" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text x="210" y="188" font-size="16" font-weight="700">Balance Service</text><path class="l" d="M210 212v31"/>
  <rect class="b" x="45" y="250" width="330" height="70" rx="9" fill="#f2edfb" stroke="#9982bd"/><text x="210" y="280" font-size="16" font-weight="700">Authoritative consistent store</text><text x="210" y="304" font-size="12">Redis is outside the critical path</text><path class="l" d="M210 320v28"/>
  <text x="210" y="372" font-size="14">Authoritative balance response</text></g>
</svg>
