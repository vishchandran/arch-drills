<text class="t" x="210.0" y="681" font-size="15" font-weight="700">Continuous durable-state replication</text>
<text class="t" x="210.0" y="701" font-size="13" font-weight="400">A → B: intent, dedup, status, audit</text>
<text class="t" x="210.0" y="721" font-size="13" font-weight="400">Broker/retry state + config readiness</text>
<rect class="b" x="38" y="754" width="344" height="78" rx="9" fill="#fff5df" stroke="#c8a85a"/>
<text class="t" x="210.0" y="779" font-size="15" font-weight="700">Automated failover: A → B</text>
<text class="t" x="210.0" y="799" font-size="13" font-weight="400">Validate recovery; fence A; promote B</text>
<text class="t" x="210.0" y="819" font-size="13" font-weight="400">Targets: RPO &lt;1m and RTO &lt;1m</text>
<path class="l d" d="M210 734v16"/>
<rect class="b" x="38" y="852" width="344" height="78" rx="9" fill="#e8f7f1" stroke="#72aa93"/>
<text class="t" x="210.0" y="877" font-size="15" font-weight="700">Controlled failback: B → A</text>
<text class="t" x="210.0" y="897" font-size="13" font-weight="400">Synchronize, reconcile, verify readiness</text>
<text class="t" x="210.0" y="917" font-size="13" font-weight="400">Canary / ramp with exclusive ownership</text>
<path class="l d" d="M210 832v16"/>
<text class="t" x="210" y="964" font-size="13">Grey: deployed standby; no send authority</text>
<text class="t" x="210" y="986" font-size="13">Providers are external; validate both regions</text>
