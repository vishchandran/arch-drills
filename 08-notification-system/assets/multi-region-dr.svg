<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1030" viewBox="0 0 420 1030" role="img" aria-labelledby="title desc">
<title id="title">Active-passive regional recovery</title><desc id="desc">Two complete parallel regional stacks. Region A is active; grey Region B is ready but cannot send until fenced promotion. Only durable state is continuously replicated. Automated failover targets under one minute; failback is controlled.</desc>
