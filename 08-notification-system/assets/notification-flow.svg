<svg xmlns="http://www.w3.org/2000/svg" width="420" height="940" viewBox="0 0 420 940" role="img" aria-labelledby="title desc">
<title id="title">Business event to notification</title><desc id="desc">Payment publishes a business event through a durable async boundary. Notification deduplicates, isolates priority lanes, applies preferences and templates, and routes to providers. State and observability span the lifecycle.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#49647a"/></marker><style>.t{font-family:Arial,sans-serif;fill:#18364b;text-anchor:middle}.b{stroke-width:1.5}.l{fill:none;stroke:#49647a;stroke-width:2;marker-end:url(#arrow)}.d{stroke-dasharray:6 5}</style></defs>
<rect width="420" height="940" rx="12" fill="#fff"/>
<text class="t" x="210.0" y="30" font-size="18" font-weight="700">Business event to notification</text>
<rect class="b" x="38" y="54" width="344" height="78" rx="9" fill="#e8f7f1" stroke="#72aa93"/>
<text class="t" x="210.0" y="79" font-size="15" font-weight="700">Payment Service</text>
<text class="t" x="210.0" y="99" font-size="13" font-weight="400">Commit outcome + event intent</text>
<path class="l" d="M210 132v23"/>
<rect class="b" x="38" y="160" width="344" height="78" rx="9" fill="#edf5fb" stroke="#8aaac2"/>
<text class="t" x="210.0" y="185" font-size="15" font-weight="700">Broker / topic — async boundary</text>
<text class="t" x="210.0" y="205" font-size="13" font-weight="400">PaymentCompleted • EVT-789</text>
<text class="t" x="210.0" y="225" font-size="13" font-weight="400">Payment does not wait for delivery</text>
<path class="l" d="M210 238v23"/>
<rect class="b" x="38" y="266" width="344" height="78" rx="9" fill="#f2edfb" stroke="#9982bd"/>
<text class="t" x="210.0" y="291" font-size="15" font-weight="700">Notification Platform</text>
<text class="t" x="210.0" y="311" font-size="13" font-weight="400">Validate + dedup eventId</text>
<text class="t" x="210.0" y="331" font-size="13" font-weight="400">Persist unique notification intent</text>
<path class="l" d="M210 344v23"/>
<rect class="b" x="38" y="372" width="344" height="78" rx="9" fill="#fff5df" stroke="#c8a85a"/>
<text class="t" x="210.0" y="397" font-size="15" font-weight="700">Separate processing lanes</text>
<text class="t" x="210.0" y="417" font-size="13" font-weight="400">Critical / transactional / bulk</text>
<text class="t" x="210.0" y="437" font-size="13" font-weight="400">Reserved capacity + quotas</text>
<path class="l" d="M210 450v23"/>
<rect class="b" x="38" y="478" width="344" height="78" rx="9" fill="#fff5df" stroke="#c8a85a"/>
<text class="t" x="210.0" y="503" font-size="15" font-weight="700">Preference / policy</text>
<text class="t" x="210.0" y="523" font-size="13" font-weight="400">Consent, urgency, quiet hours</text>
<text class="t" x="210.0" y="543" font-size="13" font-weight="400">Defer or suppress when required</text>
<path class="l" d="M210 556v23"/>
<rect class="b" x="38" y="584" width="344" height="78" rx="9" fill="#edf5fb" stroke="#8aaac2"/>
<text class="t" x="210.0" y="609" font-size="15" font-weight="700">Versioned template</text>
<text class="t" x="210.0" y="629" font-size="13" font-weight="400">Locale + minimal masked data</text>
<path class="l" d="M210 662v23"/>
<rect class="b" x="38" y="690" width="344" height="78" rx="9" fill="#edf5fb" stroke="#8aaac2"/>
<text class="t" x="210.0" y="715" font-size="15" font-weight="700">Router → provider</text>
<text class="t" x="210.0" y="735" font-size="13" font-weight="400">Approved channel / fallback</text>
<text class="t" x="210.0" y="755" font-size="13" font-weight="400">Stable N123 + provider idempotency</text>
<path class="l" d="M210 768v23"/>
<rect class="b" x="38" y="796" width="344" height="78" rx="9" fill="#e8f7f1" stroke="#72aa93"/>
<text class="t" x="210.0" y="821" font-size="15" font-weight="700">Customer delivery</text>
<text class="t" x="210.0" y="841" font-size="13" font-weight="400">Accepted ≠ delivered ≠ read</text>
<rect class="b" x="38" y="902" width="344" height="30" rx="9" fill="#f2edfb" stroke="#9982bd"/>
<text class="t" x="210.0" y="927" font-size="15" font-weight="700">Status / audit + observability</text>
</svg>
