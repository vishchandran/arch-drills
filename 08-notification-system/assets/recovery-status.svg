<svg xmlns="http://www.w3.org/2000/svg" width="420" height="780" viewBox="0 0 420 780" role="img" aria-labelledby="title desc">
<title id="title">Recovery and delivery evidence</title><desc id="desc">Failures anywhere in processing and delivery are classified. Transient failures use bounded retry, permanent or exhausted failures use an owned DLQ, and repaired eligible work returns through deduplication. Provider receipts feed status; observability is cross-cutting.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#49647a"/></marker><style>.t{font-family:Arial,sans-serif;fill:#18364b;text-anchor:middle}.b{stroke-width:1.5}.l{fill:none;stroke:#49647a;stroke-width:2;marker-end:url(#arrow)}.d{stroke-dasharray:6 5}</style></defs>
<rect width="420" height="780" rx="12" fill="#fff"/>
<text class="t" x="210.0" y="30" font-size="18" font-weight="700">Recovery and delivery evidence</text>
<rect class="b" x="38" y="54" width="344" height="78" rx="9" fill="#edf5fb" stroke="#8aaac2"/>
<text class="t" x="210.0" y="79" font-size="15" font-weight="700">Processing + provider attempts</text>
<text class="t" x="210.0" y="99" font-size="13" font-weight="400">Policy / template / routing / send</text>
<path class="l" d="M210 132v23"/>
<rect class="b" x="38" y="160" width="344" height="78" rx="9" fill="#fff5df" stroke="#c8a85a"/>
<text class="t" x="210.0" y="185" font-size="15" font-weight="700">Failure classification</text>
<text class="t" x="210.0" y="205" font-size="13" font-weight="400">Transient → bounded backoff + jitter</text>
<text class="t" x="210.0" y="225" font-size="13" font-weight="400">Malformed or exhausted → owned DLQ</text>
<path class="l" d="M210 238v23"/>
<rect class="b" x="38" y="266" width="344" height="78" rx="9" fill="#fff5df" stroke="#c8a85a"/>
<text class="t" x="210.0" y="291" font-size="15" font-weight="700">Provider health + capacity</text>
<text class="t" x="210.0" y="311" font-size="13" font-weight="400">Open breaker stops unhealthy calls</text>
<text class="t" x="210.0" y="331" font-size="13" font-weight="400">Half-open probes; close on recovery</text>
<path class="l" d="M210 344v23"/>
<rect class="b" x="38" y="372" width="344" height="78" rx="9" fill="#fff5df" stroke="#c8a85a"/>
<text class="t" x="210.0" y="397" font-size="15" font-weight="700">Repair / select / canary / ramp</text>
<text class="t" x="210.0" y="417" font-size="13" font-weight="400">Replay only still-required work</text>
<text class="t" x="210.0" y="437" font-size="13" font-weight="400">Preserve IDs; respect provider quotas</text>
<path class="l" d="M210 450v23"/>
<rect class="b" x="38" y="478" width="344" height="78" rx="9" fill="#f2edfb" stroke="#9982bd"/>
<text class="t" x="210.0" y="503" font-size="15" font-weight="700">Re-enter through durable state</text>
<text class="t" x="210.0" y="523" font-size="13" font-weight="400">Dedup + unfinished intent recovery</text>
<text class="t" x="210.0" y="543" font-size="13" font-weight="400">Completed sends remain suppressed</text>
<rect class="b" x="38" y="594" width="344" height="78" rx="9" fill="#f2edfb" stroke="#9982bd"/>
<text class="t" x="210.0" y="619" font-size="15" font-weight="700">Delivery status + audit</text>
<text class="t" x="210.0" y="639" font-size="13" font-weight="400">Request / accepted / delivered / unknown</text>
<text class="t" x="210.0" y="659" font-size="13" font-weight="400">Authenticated receipts + attempt history</text>
<rect class="b" x="38" y="694" width="344" height="64" rx="9" fill="#edf5fb" stroke="#8aaac2"/>
<text class="t" x="210.0" y="719" font-size="15" font-weight="700">Observability across all components</text>
<text class="t" x="210.0" y="739" font-size="13" font-weight="400">Lag, age, errors, SLOs, provider, DR</text>
</svg>
