<svg xmlns="http://www.w3.org/2000/svg" width="420" height="930" viewBox="0 0 420 930" role="img" aria-labelledby="title desc">
<title id="title">Atomic claim and fenced execution authority</title><desc id="desc">Two workers race to claim one due execution. Worker A receives token 41, pauses, and its lease expires. Worker B reclaims with token 42. Downstream accepts token 42 and rejects stale token 41 while execution idempotency prevents duplicate financial effect.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#49647a"/></marker><style>.t{font-family:Arial,sans-serif;fill:#18364b;text-anchor:middle}.b{stroke-width:1.5}.l{fill:none;stroke:#49647a;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="420" height="930" rx="12" fill="#fff"/><text class="t" x="210" y="30" font-size="18" font-weight="700">Claim, lease and fencing</text>
<rect class="b" x="38" y="54" width="344" height="72" rx="9" fill="#f2edfb" stroke="#9982bd"/><text class="t" x="210" y="80" font-size="15" font-weight="700">Execution E-100 is DUE</text><text class="t" x="210" y="102" font-size="13">Stable identity • no current owner</text><path class="l" d="M210 126v24"/>
<rect class="b" x="18" y="155" width="184" height="78" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text class="t" x="110" y="181" font-size="15" font-weight="700">Worker A</text><text class="t" x="110" y="202" font-size="13">Conditional claim</text><text class="t" x="110" y="220" font-size="13">wins token 41</text>
<rect class="b" x="218" y="155" width="184" height="78" rx="9" fill="#f0f1f3" stroke="#a8adb5"/><text class="t" x="310" y="181" font-size="15" font-weight="700">Worker B</text><text class="t" x="310" y="202" font-size="13">Competing claim</text><text class="t" x="310" y="220" font-size="13">fails condition</text><path class="l" d="M110 233v24"/>
<rect class="b" x="38" y="262" width="344" height="78" rx="9" fill="#fff5df" stroke="#c8a85a"/><text class="t" x="210" y="288" font-size="15" font-weight="700">A pauses; lease 41 expires</text><text class="t" x="210" y="309" font-size="13">Lease enables another owner to recover</text><text class="t" x="210" y="327" font-size="13">Expiry does not stop A from resuming</text><path class="l" d="M210 340v24"/>
<rect class="b" x="38" y="369" width="344" height="78" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text class="t" x="210" y="395" font-size="15" font-weight="700">Worker B atomically reclaims</text><text class="t" x="210" y="416" font-size="13">Owner B • lease renewed • token 42</text><text class="t" x="210" y="434" font-size="13">Dispatch uses E-100 + token 42</text><path class="l" d="M210 447v24"/>
<rect class="b" x="38" y="476" width="344" height="78" rx="9" fill="#f2edfb" stroke="#9982bd"/><text class="t" x="210" y="502" font-size="15" font-weight="700">Downstream fencing state</text><text class="t" x="210" y="523" font-size="13">Greatest accepted token = 42</text><text class="t" x="210" y="541" font-size="13">Execution-ID idempotency = E-100</text>
<path class="l" d="M130 554v32"/><path class="l" d="M290 554v32"/>
<rect class="b" x="18" y="591" width="184" height="92" rx="9" fill="#fdeeee" stroke="#c87b7b"/><text class="t" x="110" y="617" font-size="15" font-weight="700">A resumes: token 41</text><text class="t" x="110" y="640" font-size="13">41 &lt; 42</text><text class="t" x="110" y="662" font-size="14" font-weight="700" fill="#9b3d3d">REJECT STALE</text>
<rect class="b" x="218" y="591" width="184" height="92" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text class="t" x="310" y="617" font-size="15" font-weight="700">B executes: token 42</text><text class="t" x="310" y="640" font-size="13">42 is current</text><text class="t" x="310" y="662" font-size="14" font-weight="700">ACCEPT</text><path class="l" d="M310 683v30"/>
<rect class="b" x="38" y="718" width="344" height="88" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text class="t" x="210" y="744" font-size="15" font-weight="700">Transfer Service + ledger</text><text class="t" x="210" y="766" font-size="13">Unique E-100 produces one financial effect</text><text class="t" x="210" y="788" font-size="13">Repeated request returns stored outcome</text>
<text class="t" x="210" y="848" font-size="13">Lease provides liveness • fencing provides stale-owner safety</text><text class="t" x="210" y="873" font-size="13">Financial idempotency protects the external effect boundary</text>
</svg>
