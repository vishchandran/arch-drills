<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1030" viewBox="0 0 420 1030" role="img" aria-labelledby="title desc">
<title id="title">Quorum-safe per-shard regional recovery</title><desc id="desc">Region A and Region B host complete scheduler stacks while a third voting failure domain prevents split brain. Synchronous quorum provides zero recovery point loss. Each shard has one authority, and failover fences the old term before restoring service within five minutes.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#49647a"/></marker><style>.t{font-family:Arial,sans-serif;fill:#18364b;text-anchor:middle}.b{stroke-width:1.5}.l{fill:none;stroke:#49647a;stroke-width:2;marker-end:url(#arrow)}.d{stroke-dasharray:6 5}</style></defs>
<rect width="420" height="1030" rx="12" fill="#fff"/><text class="t" x="210" y="30" font-size="18" font-weight="700">Per-shard quorum and regional recovery</text>
<rect class="b" x="16" y="54" width="182" height="44" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text class="t" x="107" y="81" font-size="15" font-weight="700">Region A — authority</text>
<rect class="b" x="222" y="54" width="182" height="44" rx="9" fill="#f0f1f3" stroke="#a8adb5"/><text class="t" x="313" y="81" font-size="15" font-weight="700">Region B — ready</text>
<rect class="b" x="16" y="122" width="182" height="62" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text class="t" x="107" y="148" font-size="14" font-weight="700">API + shard router</text><text class="t" x="107" y="169" font-size="12">Current term metadata</text>
<rect class="b" x="222" y="122" width="182" height="62" rx="9" fill="#f0f1f3" stroke="#a8adb5"/><text class="t" x="313" y="148" font-size="14" font-weight="700">API + shard router</text><text class="t" x="313" y="169" font-size="12">Standby routing</text>
<path class="l" d="M107 184v22"/><path class="l" d="M313 184v22"/>
<rect class="b" x="16" y="211" width="182" height="72" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text class="t" x="107" y="237" font-size="14" font-weight="700">Detector + relay</text><text class="t" x="107" y="258" font-size="12">Shard 7 • term 81</text><text class="t" x="107" y="276" font-size="12">Dispatch enabled</text>
<rect class="b" x="222" y="211" width="182" height="72" rx="9" fill="#f0f1f3" stroke="#a8adb5"/><text class="t" x="313" y="237" font-size="14" font-weight="700">Detector + relay</text><text class="t" x="313" y="258" font-size="12">Shard 7 replica</text><text class="t" x="313" y="276" font-size="12">No authority</text>
<path class="l" d="M107 283v22"/><path class="l" d="M313 283v22"/>
<rect class="b" x="16" y="310" width="182" height="72" rx="9" fill="#f2edfb" stroke="#9982bd"/><text class="t" x="107" y="336" font-size="14" font-weight="700">Shard replica A</text><text class="t" x="107" y="357" font-size="12">Schedule • claim • outbox</text><text class="t" x="107" y="375" font-size="12">Voting member</text>
<rect class="b" x="222" y="310" width="182" height="72" rx="9" fill="#f2edfb" stroke="#9982bd"/><text class="t" x="313" y="336" font-size="14" font-weight="700">Shard replica B</text><text class="t" x="313" y="357" font-size="12">Synchronous committed log</text><text class="t" x="313" y="375" font-size="12">Voting member</text>
<path class="l d" d="M198 346h24"/>
<rect class="b" x="78" y="420" width="264" height="68" rx="9" fill="#fff5df" stroke="#c8a85a"/><text class="t" x="210" y="446" font-size="15" font-weight="700">Third voting failure domain</text><text class="t" x="210" y="468" font-size="13">Odd quorum • cannot form two majorities</text>
<path class="l d" d="M107 382L165 420"/><path class="l d" d="M313 382L255 420"/>
<rect class="b" x="38" y="530" width="344" height="82" rx="9" fill="#f2edfb" stroke="#9982bd"/><text class="t" x="210" y="556" font-size="15" font-weight="700">Commit requires majority</text><text class="t" x="210" y="578" font-size="13">Acknowledged state survives one region loss</text><text class="t" x="210" y="599" font-size="13">RPO 0 for committed scheduler state</text>
<rect class="b" x="38" y="642" width="344" height="104" rx="9" fill="#fff5df" stroke="#c8a85a"/><text class="t" x="210" y="668" font-size="15" font-weight="700">Per-shard failover: A → B</text><text class="t" x="210" y="690" font-size="13">Confirm quorum + current log</text><text class="t" x="210" y="711" font-size="13">Advance term 82 • fence A • route B</text><text class="t" x="210" y="732" font-size="13">Canary then paced backlog recovery</text><path class="l" d="M210 612v26"/>
<rect class="b" x="38" y="776" width="344" height="82" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text class="t" x="210" y="802" font-size="15" font-weight="700">Useful service restored ≤ 5 minutes</text><text class="t" x="210" y="824" font-size="13">Detection + fencing + promotion + routing</text><text class="t" x="210" y="845" font-size="13">Old term and stale tokens rejected</text><path class="l" d="M210 746v26"/>
<rect class="b" x="38" y="888" width="344" height="82" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text class="t" x="210" y="914" font-size="15" font-weight="700">Controlled failback: B → A</text><text class="t" x="210" y="936" font-size="13">Rebuild • catch up • verify • transfer term</text><text class="t" x="210" y="957" font-size="13">One authority per shard throughout</text><path class="l" d="M210 858v26"/>
<text class="t" x="210" y="1005" font-size="13">No quorum → stop affected shard; never permit split brain</text>
</svg>
