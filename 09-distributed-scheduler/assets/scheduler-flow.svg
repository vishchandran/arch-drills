<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1110" viewBox="0 0 420 1110" role="img" aria-labelledby="title desc">
<title id="title">Distributed scheduler final architecture</title><desc id="desc">A scheduling API writes a sharded durable database. Due jobs are atomically claimed with leases and fencing, written to an outbox, published through Kafka, executed by workers and deduplicated by the Transfer Service and ledger.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#49647a"/></marker><style>.t{font-family:Arial,sans-serif;fill:#18364b;text-anchor:middle}.b{stroke-width:1.5}.l{fill:none;stroke:#49647a;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="420" height="1110" rx="12" fill="#fff"/><text class="t" x="210" y="30" font-size="18" font-weight="700">Scheduled intent to financial outcome</text>
<rect class="b" x="38" y="54" width="344" height="72" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text class="t" x="210" y="80" font-size="15" font-weight="700">Scheduling API</text><text class="t" x="210" y="102" font-size="13">Idempotent create • update • cancel</text><path class="l" d="M210 126v22"/>
<rect class="b" x="38" y="153" width="344" height="78" rx="9" fill="#f2edfb" stroke="#9982bd"/><text class="t" x="210" y="178" font-size="15" font-weight="700">Sharded Schedule Database</text><text class="t" x="210" y="199" font-size="13">Schedule • occurrence • claim • audit</text><text class="t" x="210" y="218" font-size="13">Synchronous cross-region quorum</text><path class="l" d="M210 231v22"/>
<rect class="b" x="38" y="258" width="344" height="78" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text class="t" x="210" y="283" font-size="15" font-weight="700">Due-job detector</text><text class="t" x="210" y="304" font-size="13">Shard-local indexed time windows</text><text class="t" x="210" y="323" font-size="13">Bounded fair batches</text><path class="l" d="M210 336v22"/>
<rect class="b" x="38" y="363" width="344" height="78" rx="9" fill="#fff5df" stroke="#c8a85a"/><text class="t" x="210" y="388" font-size="15" font-weight="700">Atomic claim + lease + fencing token</text><text class="t" x="210" y="409" font-size="13">One current owner • stale authority rejected</text><text class="t" x="210" y="428" font-size="13">Priority + global admission control</text><path class="l" d="M210 441v22"/>
<rect class="b" x="38" y="468" width="344" height="72" rx="9" fill="#f2edfb" stroke="#9982bd"/><text class="t" x="210" y="494" font-size="15" font-weight="700">Transactional outbox</text><text class="t" x="210" y="516" font-size="13">Execution ID + durable dispatch intent</text><path class="l" d="M210 540v22"/>
<rect class="b" x="38" y="567" width="344" height="72" rx="9" fill="#edf5fb" stroke="#8aaac2"/><text class="t" x="210" y="593" font-size="15" font-weight="700">Outbox relay → Kafka</text><text class="t" x="210" y="615" font-size="13">At-least-once buffered delivery</text><path class="l" d="M210 639v22"/>
<rect class="b" x="38" y="666" width="344" height="78" rx="9" fill="#fff5df" stroke="#c8a85a"/><text class="t" x="210" y="691" font-size="15" font-weight="700">Priority-isolated execution workers</text><text class="t" x="210" y="712" font-size="13">Critical / standard / bulk</text><text class="t" x="210" y="731" font-size="13">Backpressure • retry • reconciliation</text><path class="l" d="M210 744v22"/>
<rect class="b" x="38" y="771" width="344" height="78" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text class="t" x="210" y="796" font-size="15" font-weight="700">Transfer Service</text><text class="t" x="210" y="817" font-size="13">Authoritative execution-ID idempotency</text><text class="t" x="210" y="836" font-size="13">Authorization + financial rules</text><path class="l" d="M210 849v22"/>
<rect class="b" x="38" y="876" width="344" height="72" rx="9" fill="#e8f7f1" stroke="#72aa93"/><text class="t" x="210" y="902" font-size="15" font-weight="700">Ledger</text><text class="t" x="210" y="924" font-size="13">One financial effect per execution ID</text><path class="l" d="M210 948v22"/>
<rect class="b" x="38" y="975" width="344" height="78" rx="9" fill="#f2edfb" stroke="#9982bd"/><text class="t" x="210" y="1000" font-size="15" font-weight="700">Outcome + reconciliation evidence</text><text class="t" x="210" y="1021" font-size="13">Transfer outbox → payment outcome</text><text class="t" x="210" y="1040" font-size="13">Schedule → execution → ledger trace</text>
<text class="t" x="210" y="1086" font-size="13">Scheduler owns time • Transfer and ledger own money</text>
</svg>
